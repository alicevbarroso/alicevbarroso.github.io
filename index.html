<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alice | English & Tech</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #c9d8ff;
      color: #0f172a;
      text-align: center;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .profile-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 4px solid #78aeff;
      object-fit: cover;
    }

    h1 {
      margin: 15px 0 5px;
      font-size: 22px;
    }

    p {
      font-size: 14px;
      line-height: 1.5;
      color: #334155;
    }

    .socials {
      margin: 15px 0 25px;
      display: flex;
      justify-content: center;
      gap: 18px;
      font-size: 20px;
    }

    .socials a {
      color: #0f172a;
      transition: 0.2s;
    }

    .socials a:hover {
      color: #78aeff;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 12px;
      margin: 12px 0;
      text-align: left;
      text-decoration: none;
      display: block;
      color: #0f172a;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .card img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .card-title {
      font-weight: 600;
      font-size: 15px;
    }
  </style>
</head>

<body>
  <div class="container">

    <img src="foto_perfil.jpeg" class="profile-img">

    <h1>alicevbarroso</h1>
    <p>
      Estudando TI na prática 💻✨<br>
      Projetos, programação e aprendizado 🚀
    </p>

    <div class="socials">
      <a href="https://www.instagram.com/alicevbarroso/"><i class="fab fa-instagram"></i></a>
      <a href="https://www.tiktok.com/@alice.codes"><i class="fab fa-tiktok"></i></a>
      <a href="https://wa.me/5521967522549"><i class="fab fa-whatsapp"></i></a>
      <a href="https://github.com/alicevbarroso"><i class="fab fa-github"></i></a>
      <a href="https://www.linkedin.com/in/alicevbarroso/"><i class="fab fa-linkedin"></i></a>
    </div>

    <a href="https://builder.aws.com/start?trk=cb468e81-6773-4b53-ad60-9eaaa7caa4e1&sc_channel=sm" class="card">
      <img src="aws.png">
      <div class="card-title">AWS Builder Center</div>
    </a>

    <a href="https://wa.me/5521967522549" class="card">
      <div class="card-title">English classes</div>
    </a>

  </div>
</body>
</html>
